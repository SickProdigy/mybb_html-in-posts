name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v2.0.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Validate source and package archive
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r php_file; do
            php -l "$php_file" >/dev/null
          done < <(find Upload tests -type f -name '*.php' | sort)

          for test_file in tests/*.php; do
            php "$test_file"
          done

          version="$(sed -n 's/.*"version"[[:space:]]*=>[[:space:]]*"\([^"]*\)".*/\1/p' Upload/inc/plugins/htmlposts.php | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Plugin version is missing or invalid: $version" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match plugin version $version." >&2
            exit 1
          fi
          if ! grep -F -x "v$version" changelog.txt >/dev/null; then
            echo "changelog.txt has no release heading for v$version." >&2
            exit 1
          fi

          release_body="$(awk -v heading="v$version" '
            $0 == heading { in_section = 1; next }
            in_section && /^v[0-9]/ { exit }
            in_section { print }
          ' changelog.txt | sed '/./,$!d')"
          [ -n "$release_body" ] || release_body="Automated release for $RELEASE_TAG."

          mkdir -p dist
          archive="dist/mybb-html-in-posts-$version.zip"
          zip -X -q -r "$archive" Upload README.md license.txt changelog.txt

          archive_contents="$(unzip -Z1 "$archive")"
          required_entries=(
            Upload/inc/plugins/htmlposts.php
            README.md
            license.txt
            changelog.txt
          )
          for required_entry in "${required_entries[@]}"; do
            grep -F -x "$required_entry" <<< "$archive_contents" >/dev/null || {
              echo "Archive is missing required entry: $required_entry" >&2
              exit 1
            }
          done
          if grep -E '^(tests|\.git)/' <<< "$archive_contents" >/dev/null; then
            echo "Archive contains development-only files." >&2
            exit 1
          fi

          printf '%s\n' "$release_body" > release-notes.md

      - name: Create GitHub release or replace its archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "HTML in Posts $RELEASE_TAG" --notes-file release-notes.md --latest
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "HTML in Posts $RELEASE_TAG" --notes-file release-notes.md --latest
          fi
